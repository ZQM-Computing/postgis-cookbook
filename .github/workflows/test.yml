name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgis-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: SQL integration and data-contract assertions
    runs-on: [self-hosted, Linux, X64, zqm-linux]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@2fe291b7677a45ee1269ec56a42604c143505e7e # v1
      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Select ephemeral host port
        run: |
          POSTGIS_PORT=$(python3 -c "import socket; s=socket.socket(); s.bind(('127.0.0.1',0)); print(s.getsockname()[1]); s.close()")
          echo "POSTGIS_PORT=$POSTGIS_PORT" >> "$GITHUB_ENV"

      - name: Start PostGIS and wait for health
        run: docker compose up -d --wait db

      - name: Execute patterns and regression assertions
        run: bash scripts/run_examples.sh

      - name: Show database logs on failure
        if: failure()
        run: docker compose logs --no-color db

      - name: Tear down disposable database
        if: always()
        run: docker compose down --volumes --remove-orphans || true
