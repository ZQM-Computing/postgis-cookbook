name: Validate PostGIS examples

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgis-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgis:
    name: Run SQL examples and assertions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start PostGIS and wait for health
        run: docker compose up -d --wait db

      - name: Execute every example and assertion
        run: bash scripts/run_examples.sh

      - name: Show database logs on failure
        if: failure()
        run: docker compose logs --no-color db

      - name: Tear down disposable database
        if: always()
        run: docker compose down --volumes --remove-orphans
