name: Validate PostGIS examples

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgis-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgis:
    name: Run SQL examples and assertions
    runs-on: [self-hosted, Linux, X64, zqm-linux]
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: postgis-cookbook-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Isolate Docker configuration
        id: docker-config
        run: |
          config_dir="$(mktemp -d "$RUNNER_TEMP/postgis-docker.XXXXXXXX")"
          echo "DOCKER_CONFIG=$config_dir" >> "$GITHUB_ENV"
          echo "path=$config_dir" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start PostGIS and wait for health
        run: |
          # Registry/CDN pulls fail transiently (EOF, 429, 5xx). Retry with
          # backoff so a network blip never turns a green commit red.
          for attempt in 1 2 3 4 5; do
            if docker compose up -d --wait db; then
              echo "database healthy on attempt ${attempt}"
              exit 0
            fi
            echo "::warning::docker compose up failed (attempt ${attempt}/5); backing off"
            docker compose down --volumes --remove-orphans || true
            sleep $((attempt * 10))
          done
          echo "::error::PostGIS did not become healthy after 5 attempts"
          docker compose logs --no-color db || true
          exit 1

      - name: Execute every example and assertion
        run: bash scripts/run_examples.sh

      - name: Execute read-only query-plan benchmark smoke tests
        run: |
          docker compose exec -T db psql \
            -U patterns \
            -d postgis_patterns \
            -v ON_ERROR_STOP=1 \
            < scripts/benchmark_queries.sql

      - name: Show database logs on failure
        if: failure()
        run: docker compose logs --no-color db

      - name: Tear down disposable database
        if: always()
        run: docker compose down --volumes --remove-orphans || true

      - name: Remove Docker configuration
        if: always() && steps.docker-config.outputs.path != ''
        env:
          CONFIG_DIR: ${{ steps.docker-config.outputs.path }}
        run: rm -rf -- "$CONFIG_DIR"
