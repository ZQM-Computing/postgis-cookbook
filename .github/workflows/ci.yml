name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: Static repository validation
    runs-on: [self-hosted, Linux, X64, zqm-linux]
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select isolated Docker resources
        run: |
          RESOURCE="postgis-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "POSTGIS_CONTAINER_NAME=$RESOURCE" >> "$GITHUB_ENV"
          echo "POSTGIS_VOLUME_NAME=${RESOURCE}-data" >> "$GITHUB_ENV"

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@2fe291b7677a45ee1269ec56a42604c143505e7e # v1
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate documentation and local links
        run: python3 scripts/check_docs.py
      - name: Require SQL examples and assertions
        run: |
          test -n "$(find sql patterns examples -type f -name '*.sql' -print -quit)"
          test -f tests/assertions.sql
          test -f scripts/benchmark_queries.sql
          test -f docs/production-runbook.md
          bash -n scripts/run_examples.sh scripts/wait_for_db.sh
