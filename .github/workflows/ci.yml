name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-validation:
    name: Static repository validation
    runs-on: [self-hosted, Linux, X64, zqm-linux]
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Isolate Docker configuration
        id: docker-config
        run: |
          config_dir="$(mktemp -d "$RUNNER_TEMP/postgis-docker.XXXXXXXX")"
          echo "DOCKER_CONFIG=$config_dir" >> "$GITHUB_ENV"
          echo "path=$config_dir" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@54042514f505b273907334ae2b9cdbb9a0213c1a # v2
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Validate documentation and local links
        run: python3 scripts/check_docs.py
      - name: Require SQL examples and assertions
        run: |
          test -n "$(find sql patterns examples -type f -name '*.sql' -print -quit)"
          test -f tests/assertions.sql
          test -f scripts/benchmark_queries.sql
          test -f docs/production-runbook.md
          bash -n scripts/run_examples.sh scripts/wait_for_db.sh
      - name: Remove Docker configuration
        if: always() && steps.docker-config.outputs.path != ''
        env:
          CONFIG_DIR: ${{ steps.docker-config.outputs.path }}
        run: rm -rf -- "$CONFIG_DIR"
