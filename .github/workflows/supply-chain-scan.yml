name: Supply Chain Security Scan
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Download pinned ZQM supply-chain scanner
        run: |
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/ZQM-Labs/zqm-supply-chain/072965c6d7b13cc209867225bbfd85ec83ab6285/snyk_replacement.py" \
            --output "$RUNNER_TEMP/snyk_replacement.py"
      - name: Run supply-chain scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python "$RUNNER_TEMP/snyk_replacement.py" \
            --repo "${{ github.repository }}" \
            --root "." \
            --output both \
            --pr "${{ github.event.pull_request.number || 0 }}"
      - name: Upload SARIF (best-effort when code scanning is unavailable)
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: .zqm-security-reports/${{ github.repository_owner }}_${{ github.event.repository.name }}/*-results.sarif
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-scan-${{ github.run_id }}
          path: .zqm-security-reports/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
